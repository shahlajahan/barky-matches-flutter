# Petsupo Marketplace P1-A compliance foundation — compliance-scanner
# service, clamd configuration (Slice 2.1, part E). Bound to a local
# Unix socket ONLY — never a TCP port, and never anything but loopback —
# so clamd is reachable exclusively by the adapter process inside this
# same container, never from outside it (Cloud Run's own network
# boundary and IAM govern the container's own HTTP port; this file
# governs what's reachable *inside* the container).
#
# Bounded explicitly for a 15MB application-level document ceiling, with
# headroom, and hard caps against decompression-bomb-style resource
# exhaustion from a maliciously crafted archive.

# LogFile: CORRECTED after a real Docker verification failure. The
# original value here, /dev/stdout, made clamd fail at startup with
# "ERROR: Failed to open log file /dev/stdout: Symbolic link loop" —
# empirically confirmed, reproduced identically even when pointed at
# /proc/1/fd/1 instead (a commonly-cited alternative for this exact
# symptom elsewhere), so this is not a path-resolution quirk specific to
# /dev/stdout — clamd's own log-file-opening code in this
# Alpine/musl/1.4.6 combination does not handle a symlink-to-a-pipe
# target the way a regular file open expects. The working fix, verified
# in a real container: log to an actual regular file on the writable
# /tmp tmpfs, and have entrypoint.sh tail it into the container's own
# stdout (which Docker's log driver DOES capture correctly, since that
# script is PID 1) — this achieves the same "logs visible via `docker
# logs` / Cloud Run's log viewer" outcome without hitting clamd's own
# broken-symlink-open code path at all.
LogFile /tmp/clamd.log
LogFileMaxSize 0
LogTime yes
LogVerbose no
PidFile /var/run/clamav/clamd.pid

LocalSocket /var/run/clamav/clamd.sock
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket yes
# No TCPSocket directive at all — clamd only ever listens on the local
# Unix socket above, never a network port.

User clamav

# Concurrency bounded to match this container's own modest CPU
# allocation (2 vCPU) — not a hard security control, a resource-shaping
# one.
MaxThreads 4
MaxConnectionQueueLength 16
MaxQueue 16

# Size bounds — StreamMaxLength/MaxFileSize sit comfortably above the
# application's 15MB ceiling (enforced independently and first, in
# contract.js) so clamd itself never has to be the sole enforcer, while
# still being a small, fixed multiple of it, not unbounded.
StreamMaxLength 20M
MaxFileSize 20M
MaxScanSize 100M

# Decompression-bomb / archive-resource-exhaustion bounds — a small
# number of nested/embedded files and a shallow recursion depth are
# enough for any legitimate PDF/JPEG/PNG compliance document; anything
# requiring more is itself suspicious and correctly fails scanning
# rather than consuming unbounded CPU/memory.
MaxFiles 1000
MaxRecursion 10
MaxScanTime 60000
MaxEmbeddedPE 10M
MaxHTMLNormalize 10M
MaxScriptNormalize 5M
MaxZipTypeRcg 1M

# Fail closed on any internal clamd error rather than skipping the file
# silently.
AlertBrokenExecutables yes

# Encrypted-content classification (deliberate, explicit — Slice 2.1
# staging-plan item 12, corrected in the Slice 2.1 correction pass,
# part C). clamd cannot inspect the contents of an encrypted PDF/
# archive, so "clean" would be an unverified guess and silently passing
# it through unscanned would defeat the entire fail-closed design.
# AlertEncrypted yes makes clamd report encrypted content through its
# normal heuristic-detection ("FOUND") reply path, using signature names
# in the documented Heuristics.Encrypted.* family (e.g.
# Heuristics.Encrypted.PDF, Heuristics.Encrypted.Zip).
#
# clamdProtocol.js's classifySignatureName() recognizes exactly this
# signature-name family via a narrow, explicit allowlist and maps it to
# verdict: error with errorCode "encrypted_document_unsupported" — NOT
# verdict: infected. The session still fails closed either way (never
# clean), but audit/log/UI-facing state does not falsely claim confirmed
# malware for content that was merely unreadable. This is a known,
# intentional product-level limitation: a seller with a genuinely
# legitimate encrypted PDF cannot have it approved through this pipeline
# as-is and would need to submit a decrypted copy.
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
